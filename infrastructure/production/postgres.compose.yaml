services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /etc/hiliving/hiliving.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hiliving-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  hiliving-postgres-data:
    name: hiliving-postgres-data
