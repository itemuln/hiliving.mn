# Test-only overrides, merged over the main application.yml.
# The auth abuse throttles use a process-wide singleton counter shared by the cached
# @SpringBootTest context; with every MockMvc request originating from one IP,
# production-tight limits would trip mid-suite. Relax them here so behavioural tests
# exercise auth freely. The throttles themselves are validated in dedicated tests.
hiliving.security.rate-limit.login-ip-limit=1000000
hiliving.security.rate-limit.login-identifier-limit=1000000
hiliving.security.rate-limit.register-ip-limit=1000000
